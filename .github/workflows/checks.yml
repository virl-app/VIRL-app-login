name: checks

# Deterministic, no-network regression gates. Runs on every PR and on pushes
# to main so a change can't silently break the app shell, the compliance
# floor, or — the reason this workflow exists — the voice stack. None of these
# call the LLM or need secrets, so they're fast and reproducible.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # check:index needs sucrase (devDependency); the others are pure Node.
      - run: npm install --no-audit --no-fund
      - name: index.html parses
        run: npm run check:index
      - name: compliance floor + scrubber
        run: npm run check:compliance
      - name: voice stack present on all surfaces + drift scorer sane
        run: npm run check:voice
      - name: strategist grounding present on all surfaces
        run: npm run check:strategist
      - name: trend selection honors segment, boundaries, goals
        run: npm run check:trends
      - name: Pinterest + YouTube composer fields match prompt and renderer
        run: npm run check:composer
      - name: ratings are vote-only and the upsert names its conflict target
        run: npm run check:rating
      - name: trend source refusals are told apart from empty weeks
        run: npm run check:trendsource
